        <style>
            *{margin:0;padding:0;box-sizing:border-box}
            :root{
                --bg:#f7f4ef;
                --ink:#1c1c2e;
                --sub:#6b7280;
                --accent:#e03e6e;
                --accent2:#6c5ce7;
                --card:#ffffff;
                --field:#f4f1ec;
                --border:#e8e4dd;
            }
            .staticrypt-html,.staticrypt-body{height:100%}
            .staticrypt-body{
                font-family:'Noto Sans TC','Hiragino Kaku Gothic ProN','PingFang TC',sans-serif;
                color:var(--ink);
                background:var(--bg);
                -webkit-font-smoothing:antialiased;
                -moz-osx-font-smoothing:grayscale;
            }

            /* ── 柔和漸層光暈背景 ── */
            .staticrypt-content{
                position:relative;
                min-height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:24px;
                overflow:hidden;
            }
            .staticrypt-content::before{
                content:'';
                position:absolute;inset:0;
                background:
                    radial-gradient(ellipse 50% 45% at 15% 20%,rgba(224,62,110,.16) 0%,transparent 60%),
                    radial-gradient(ellipse 55% 50% at 85% 25%,rgba(108,92,231,.16) 0%,transparent 60%),
                    radial-gradient(ellipse 60% 50% at 50% 100%,rgba(0,201,167,.10) 0%,transparent 55%);
                pointer-events:none;
            }

            /* ── 卡片 ── */
            .staticrypt-form{
                position:relative;z-index:1;
                width:100%;max-width:400px;
                background:rgba(255,255,255,.82);
                backdrop-filter:blur(18px);
                -webkit-backdrop-filter:blur(18px);
                border:1px solid rgba(255,255,255,.7);
                border-radius:24px;
                padding:44px 36px 36px;
                text-align:center;
                box-shadow:0 24px 60px -12px rgba(28,28,46,.18),0 4px 12px rgba(28,28,46,.06);
                animation:cardIn .6s cubic-bezier(.22,1,.36,1) both;
            }
            @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

            /* ── 鎖頭徽章 ── */
            .lock-badge{
                width:64px;height:64px;margin:0 auto 22px;
                border-radius:20px;
                display:flex;align-items:center;justify-content:center;
                background:linear-gradient(135deg,var(--accent),var(--accent2));
                box-shadow:0 10px 24px -6px rgba(224,62,110,.5);
            }
            .lock-badge svg{width:28px;height:28px;color:#fff}

            .staticrypt-title{
                font-size:1.4rem;font-weight:800;letter-spacing:.01em;line-height:1.4;
                margin-bottom:10px;
            }
            .staticrypt-instructions{
                font-size:.92rem;color:var(--sub);line-height:1.7;
                margin-bottom:26px;
            }

            /* ── 密碼輸入 ── */
            .staticrypt-password-container{
                position:relative;margin-bottom:16px;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"]{
                width:100%;
                background:var(--field);
                border:1.5px solid transparent;
                border-radius:14px;
                font-size:15px;
                outline:0;
                padding:15px 46px 15px 16px;
                color:var(--ink);
                transition:border-color .2s,background .2s;
            }
            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus{
                border-color:var(--accent2);
                background:#fff;
            }
            .staticrypt-form input::placeholder{color:#a8a29a}
            .staticrypt-toggle-password-visibility{
                cursor:pointer;
                height:20px;width:20px;
                opacity:.5;
                padding:0;
                position:absolute;right:16px;top:50%;
                transform:translateY(-50%);
                transition:opacity .2s;
            }
            .staticrypt-toggle-password-visibility:hover{opacity:.85}

            /* ── 記住我 ── */
            label.staticrypt-remember{
                display:flex;align-items:center;justify-content:center;
                gap:9px;
                font-size:.85rem;color:var(--sub);
                margin-bottom:22px;cursor:pointer;
            }
            .staticrypt-remember input[type="checkbox"]{
                width:17px;height:17px;
                accent-color:var(--accent);
                cursor:pointer;
            }

            /* ── 解鎖按鈕 ── */
            .staticrypt-decrypt-button{
                width:100%;
                border:0;
                border-radius:14px;
                padding:15px;
                color:#fff;font-size:15px;font-weight:700;letter-spacing:.04em;
                cursor:pointer;
                background:linear-gradient(135deg,var(--accent),var(--accent2));
                box-shadow:0 12px 24px -8px rgba(108,92,231,.55);
                transition:transform .15s,box-shadow .15s,filter .15s;
            }
            .staticrypt-decrypt-button:hover{transform:translateY(-2px);box-shadow:0 16px 30px -8px rgba(108,92,231,.6)}
            .staticrypt-decrypt-button:active{transform:translateY(0)}

            .gate-footer{
                margin-top:24px;font-size:.74rem;color:#a8a29a;letter-spacing:.06em;
            }

            /* ── 載入中 ── */
            .staticrypt-spinner-container{
                height:100%;display:flex;align-items:center;justify-content:center;
            }
            .staticrypt-spinner{
                display:inline-block;width:2.2rem;height:2.2rem;
                border:.25em solid rgba(108,92,231,.25);
                border-right-color:var(--accent2);
                border-radius:50%;
                animation:spinner-border .75s linear infinite;
            }
            @keyframes spinner-border{100%{transform:rotate(360deg)}}

            .hidden{display:none !important}

            @media(max-width:480px){
                .staticrypt-form{padding:36px 24px 28px;border-radius:20px}
                .staticrypt-title{font-size:1.25rem}
            }
        </style>
